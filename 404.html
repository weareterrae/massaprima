<style>
:root{--laranja:#EC6607;--castanho:#77310A;--bege:#FEEAD3;--bege-claro:#FFF7EC;--ink:#3D1A05;--line:#e8d6bc;--mut:#8a6a4a}
*{margin:0;padding:0;box-sizing:border-box}
/* transição suave entre páginas (View Transitions API; ignorado por browsers antigos) */
@media (prefers-reduced-motion: no-preference){

}
body{font-family:'Nunito',sans-serif;background:var(--bege-claro);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px}

p{color:#5f4530;max-width:52ch;font-size:1.05rem;margin-bottom:28px}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;background:var(--laranja);color:#fff;padding:13px 26px;border-radius:40px;text-decoration:none;font-weight:800}
.btn:hover{background:var(--castanho)}
.btn.sec{background:#fff;color:var(--castanho);border:2px solid var(--line)}
.btn.sec:hover{border-color:var(--laranja);color:var(--laranja)}
.foot{margin-top:34px;color:var(--mut);font-size:.9rem}
.foot a{color:var(--laranja);text-decoration:none}
